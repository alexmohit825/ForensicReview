<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gold-scale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="defense-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="plaintiff-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6" />
  
  <!-- Subtle Grid/Crosshair Accent Lines -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Legal Balance Pillar / Pillar of Justice -->
  <path d="M 256 120 L 256 360" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  <rect x="228" y="360" width="56" height="14" rx="4" fill="#94a3b8" />
  <rect x="212" y="374" width="88" height="16" rx="6" fill="#64748b" />

  <!-- Horizontal Beam (Scales of Justice) -->
  <path d="M 136 170 C 196 160, 316 160, 376 170" fill="none" stroke="url(#gold-scale)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="256" cy="165" r="10" fill="#f59e0b" />

  <!-- Left Scale Pan: Defense / Clinical Judgment (Cobalt Blue) -->
  <line x1="136" y1="170" x2="110" y2="250" stroke="#3b82f6" stroke-width="3" opacity="0.8" />
  <line x1="136" y1="170" x2="162" y2="250" stroke="#3b82f6" stroke-width="3" opacity="0.8" />
  <path d="M 98 250 Q 136 276 174 250 Z" fill="url(#defense-lens)" opacity="0.9" />

  <!-- Right Scale Pan: Plaintiff / Breach Analysis (Ruby Red) -->
  <line x1="376" y1="170" x2="350" y2="250" stroke="#ef4444" stroke-width="3" opacity="0.8" />
  <line x1="376" y1="170" x2="402" y2="250" stroke="#ef4444" stroke-width="3" opacity="0.8" />
  <path d="M 338 250 Q 376 276 414 250 Z" fill="url(#plaintiff-lens)" opacity="0.9" />

  <!-- Forensic Medical ECG Wave Overlay (Cutting through Center Horizon) -->
  <path d="M 72 310 L 170 310 L 190 280 L 210 340 L 235 220 L 256 380 L 275 290 L 295 320 L 315 310 L 440 310" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Focal Precision Scalpel / Chrono Diamond -->
  <polygon points="256,104 266,120 256,136 246,120" fill="#38bdf8" />
</svg>