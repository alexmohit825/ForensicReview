<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="white-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gold-scale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="defense-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="plaintiff-lens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base Clean White Box Container with Subtle Shadow & Border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#white-bg)" stroke="#cbd5e1" stroke-width="8" filter="url(#card-shadow)" />
  
  <!-- Subtle Internal Grid/Crosshair Accent Lines -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6" />
  <line x1="64" y1="256" x2="448" y2="256" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Legal Balance Pillar / Pillar of Justice -->
  <path d="M 256 120 L 256 360" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  <rect x="228" y="360" width="56" height="14" rx="4" fill="#334155" />
  <rect x="212" y="374" width="88" height="16" rx="6" fill="#1e293b" />

  <!-- Horizontal Beam (Scales of Justice in Burnished Amber/Gold) -->
  <path d="M 136 170 C 196 160, 316 160, 376 170" fill="none" stroke="url(#gold-scale)" stroke-width="9" stroke-linecap="round" />
  <circle cx="256" cy="165" r="11" fill="#d97706" />

  <!-- Left Scale Pan: Defense / Clinical Judgment (Cobalt Blue) -->
  <line x1="136" y1="170" x2="110" y2="250" stroke="#2563eb" stroke-width="3.5" />
  <line x1="136" y1="170" x2="162" y2="250" stroke="#2563eb" stroke-width="3.5" />
  <path d="M 98 250 Q 136 276 174 250 Z" fill="url(#defense-lens)" />

  <!-- Right Scale Pan: Plaintiff / Breach Analysis (Ruby Red) -->
  <line x1="376" y1="170" x2="350" y2="250" stroke="#dc2626" stroke-width="3.5" />
  <line x1="376" y1="170" x2="402" y2="250" stroke="#dc2626" stroke-width="3.5" />
  <path d="M 338 250 Q 376 276 414 250 Z" fill="url(#plaintiff-lens)" />

  <!-- Forensic Medical ECG Wave Overlay (Cutting through Center in Clinical Deep Cyan) -->
  <path d="M 72 310 L 170 310 L 190 280 L 210 340 L 235 215 L 256 385 L 275 285 L 295 325 L 315 310 L 440 310" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Scalpel / Chrono Diamond -->
  <polygon points="256,102 267,118 256,134 245,118" fill="#0284c7" />
</svg>